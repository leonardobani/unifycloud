Categories:
  - Cloud Storage & File Sync
  - File Manager
License: GPL-3.0-only
AuthorName: Leonardo Bani
SourceCode: https://gitlab.com/leonardobani/unifycloud
IssueTracker: https://gitlab.com/leonardobani/unifycloud/-/issues

AutoName: UnifyCloud

RepoType: git
Repo: https://gitlab.com/leonardobani/unifycloud.git

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: v1.0.1
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make
      - apt-get install -y -t trixie-backports golang-go
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
      - go@go1.26.8
    rm:
      - android/app/src/main/jniLibs
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - sed -i -e '/org.gradle.java.home/d' -e 's/-Xmx8G/-Xmx4G/' android/gradle.properties
      - sed -i '/dependsOn("buildGoAndroid")/d' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export GOTOOLCHAIN=local
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - bash scripts/build_go_android.sh --abi armeabi-v7a
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

