Categories:
  - Cloud Storage & File Sync
  - File Manager
License: GPL-3.0-only
AuthorName: Leonardo Bani
SourceCode: https://gitlab.com/leonardobani/unifycloud
IssueTracker: https://gitlab.com/leonardobani/unifycloud/-/issues

AutoName: UnifyCloud

RepoType: git
Repo: https://gitlab.com/leonardobani/unifycloud.git

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://gitlab.com/leonardobani/unifycloud/-/releases/v%v/downloads/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/build_go_android.sh
    scanignore:
      - android/app/src/main/jniLibs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.1
    versionCode: 22
