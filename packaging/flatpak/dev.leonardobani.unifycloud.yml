id: dev.leonardobani.unifycloud
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: unifycloud

finish-args:
  # Network access for cloud APIs and sync (Google Drive, OneDrive, Dropbox, SFTP, WebDAV, S3)
  - --share=network
  # Wayland, X11 fallback and IPC display access
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware GPU rendering acceleration
  - --device=dri
  # Filesystem access for folder backup and local file management
  - --filesystem=home
  - --filesystem=/run/media
  # Notifications, system tray, and secure storage (portals are allowed automatically)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: unifycloud
    buildsystem: simple
    build-commands:
      # Install full Flutter Linux bundle so lib/ and data/ sit beside the executable
      - mkdir -p /app/dev.leonardobani.unifycloud /app/bin
      - cp -r unifycloud lib data /app/dev.leonardobani.unifycloud/
      - chmod 0755 /app/dev.leonardobani.unifycloud/unifycloud
      - ln -s /app/dev.leonardobani.unifycloud/unifycloud /app/bin/unifycloud
      # Desktop environment integration
      - install -Dm644 dev.leonardobani.unifycloud.desktop -t /app/share/applications
      - install -Dm644 dev.leonardobani.unifycloud.metainfo.xml -t /app/share/metainfo
      - install -Dm644 dev.leonardobani.unifycloud.png /app/share/icons/hicolor/512x512/apps/dev.leonardobani.unifycloud.png
    sources:
      - type: dir
        path: ../../build/linux/x64/release/bundle
      - type: file
        path: dev.leonardobani.unifycloud.desktop
      - type: file
        path: dev.leonardobani.unifycloud.metainfo.xml
      - type: file
        path: dev.leonardobani.unifycloud.png
