id: dev.leonardobani.unifycloud
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.golang
command: unifycloud

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=/run/media
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/gtk-doc

modules:
  - name: unifycloud
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/golang/bin:/run/build/unifycloud/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/unifycloud/.pub-cache
        GOTOOLCHAIN: local
        GOFLAGS: -mod=vendor
        CGO_ENABLED: '1'
    build-commands:
      - export GOPROXY=off
      - rm -f go_backend/librclone_wrapper.so
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/dev.leonardobani.unifycloud
      - mkdir -p /app/bin && ln -s /app/dev.leonardobani.unifycloud/unifycloud /app/bin/unifycloud
      - install -Dm644 dev.leonardobani.unifycloud.desktop -t /app/share/applications
      - install -Dm644 dev.leonardobani.unifycloud.metainfo.xml -t /app/share/metainfo
      - install -Dm644 dev.leonardobani.unifycloud.png /app/share/icons/hicolor/512x512/apps/dev.leonardobani.unifycloud.png
    sources:
      - type: git
        url: https://gitlab.com/leonardobani/unifycloud.git
        tag: v1.0.1
        commit: 7a3a0e6835172157007a11d9afad6b9f017c415f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
      - type: file
        path: dev.leonardobani.unifycloud.desktop
      - type: file
        path: dev.leonardobani.unifycloud.metainfo.xml
      - type: file
        path: dev.leonardobani.unifycloud.png
      - go.mod.yml
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.9
        dest: flutter
