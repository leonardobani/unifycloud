name: unifycloud
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: 3.47.4

dependencies:
  cupertino_icons: ^1.0.8
  ffi: ^2.2.0
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  go_router: ^18.0.1
  http: ^1.6.0
  open_filex: ^4.7.0
